<!DOCTYPE html>
<html>
<head>
    <title>IT Helpdesk Tracker</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <nav>
            <a href="/">Home</a>
            <a href="/add">Add Ticket</a>
            <a href="/export">Export CSV</a>
        </nav>

        <h1>IT Helpdesk Tracker</h1>

        <!-- Tickets Table -->
        <table>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

            {% for ticket in tickets %}
            <tr class="{% if ticket.status == 'Closed' %}closed{% else %}{{ ticket.priority|lower }}{% endif %}">
                <td>{{ ticket.id }}</td>
                <td>{{ ticket.title }}</td>
                <td>{{ ticket.description }}</td>
                <td>{{ ticket.priority }}</td>
                <td>{{ ticket.status }}</td>
                <td>
                    <a href="/update/{{ ticket.id }}"><button>Update</button></a>
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>
</body>
</html>
