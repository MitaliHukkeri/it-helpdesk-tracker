<!DOCTYPE html>
<html>
<head>
    <title>Update Ticket</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Home</a>
            <a href="/add">Add Ticket</a>
        </nav>

        <h1>Update Ticket</h1>

        <form method="post">
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ ticket.title }}" readonly><br>

            <label>Description:</label><br>
            <textarea name="description" readonly>{{ ticket.description }}</textarea><br>

            <label>Change Status:</label><br>
            <select name="status">
                <option value="Open" {% if ticket.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="In Progress" {% if ticket.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Closed" {% if ticket.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select><br>

            <label>Change Priority:</label><br>
            <select name="priority">
                <option value="High" {% if ticket.priority == 'High' %}selected{% endif %}>High</option>
                <option value="Medium" {% if ticket.priority == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Low" {% if ticket.priority == 'Low' %}selected{% endif %}>Low</option>
            </select><br>

            <input type="submit" value="Update Ticket">
        </form>
    </div>
</body>
</html>
